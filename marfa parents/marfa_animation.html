<!DOCTYPE html>
<html>
  <head>
    <title>Coordinates boilerplate example</title>
    <style>
      body, html{
        background: #000;
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
<script type="module">

  import * as Coordinates from
  "https://srmcgann.github.io/Coordinates/coordinates.min.js"

  var rendererOptions = {
    ambientLight: .5, margin: 0,
    fov: 800, width: 1920, height: 1080,
    //fov: 1e3/2, width: 1920/2, height: 1080/2,
    // uncomment above for lower-res, higher-performance canvas
  }
  var renderer = await Coordinates.Renderer(rendererOptions)
  
  var refTexture = 'https://cantelope42.github.io/temppp/marfa parents/marfa_dad_equirectangular.png'
  
  var S = Math.sin
  var C = Math.cos
  var Rn = Math.random
  
  var x, y, z, p, q, d
  
  Coordinates.AnimationLoop(renderer, 'Draw')

  var shaderOptions = [
    {lighting: {type: 'ambientLight', value: .8}},
    { uniform: {
      type: 'phong',
      value: .05
    } },
    { uniform: {
      type: 'reflection',
      map: refTexture,
      enabled: false,
      value: .1
    } },
    { uniform: {
      type: 'refraction2',
      angleOfRefraction: 1,
      map: refTexture,
      value: .3
    } },
  ]
  var shader = await Coordinates.BasicShader(renderer, shaderOptions)

  var shaderOptions = [
    {lighting: {type: 'ambientLight', value: 1.33}},
    { uniform: {
      type: 'phong',
      value: 0
    } }
  ]
  var backgroundShader = await Coordinates.BasicShader(renderer, shaderOptions)


  var shapes = []

  var geoOptions = {
    shapeType: 'cube',
    name: 'background',
    equirectangular: false,
    sphereize: 1,
    subs: 4,
    map: refTexture,
    scaleUVX: 2,
    scaleUVY: 2,
    size: 5e3,
    colorMix: 0,
  }
  await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
    shapes.push(geometry)
    await backgroundShader.ConnectGeometry(geometry)
  })  
  
  var pointArray = []
  var cl = 4
  var rw = 4
  var br = 4
  var sp = 4
  Array(cl*rw*br).fill().map((v, i) => {
    x = ((i%cl)-cl/2 + .5) * sp
    y = (((i/cl|0)%rw)-rw/2 + .5) * sp
    z = ((i/cl/rw|0)-br/2 + .5) * sp
    if(Math.hypot(x, y, z) < cl * sp / 2)pointArray.push([x, y, z])
  })
  
  var geoOptions = {
    shapeType: 'obj',
    url: 'https://cantelope42.github.io/temppp/marfa parents/marfa_parents.obj',
    map: 'https://cantelope42.github.io/temppp/marfa parents/texture.png',
    name: 'main',
    colorMix: 0,
  }
  await Coordinates.LoadGeometry(renderer, geoOptions).then(async (geometry) => {
    Coordinates.ShapeFromArray(geometry, pointArray).then(async res => {
      shapes.push(res)
      await shader.ConnectGeometry(res)
    })
  })
  
  
  if(0) Coordinates.LoadFPSControls(renderer, {
    flyMode: true,
    crossharSel: 2,
    crosshairSize: .5,
    mSpeed: .25,
    showCrosshair: false,
  })
  
  
  window.Draw = () => {
    var t = renderer.frameCount / 60 / 4
    renderer.z = Math.min(12, Math.max(7, (.3+C(t/4.333))*14))
    renderer.yaw += 0.001 / 4
    renderer.pitch = C(t/4)/4
    renderer.Clear()
    shapes.forEach(shape => {
      switch(shape.name){
        case 'background':
          renderer.Draw(shape)
        break
        case 'main':
          shape.shapeData.map((subShape, sIdx) => {
            if((sIdx%3)){
              subShape.pitch += C(t/16+sIdx)/40 / 4
              subShape.yaw+= C(t/16+sIdx)/40 / 4
              subShape.roll += C(t/16+sIdx)/40 / 4
            }
          })
          shape.yaw += .001 / 4
          shape.pitch += .005 / 4
          renderer.Draw(shape)
        break
        default:
          renderer.Draw(shape)
        break
      }
    })
  }
  
</script>
  </body>
</html>
